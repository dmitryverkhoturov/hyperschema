[package]
name = "hs-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "hs_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
hs-core = { path = "../core" }
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
pollster = "1"
