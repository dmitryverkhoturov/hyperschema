[package]
name = "hyperschema"
version = "0.1.0"
edition = "2021"

build = "build.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
hs-core = { path = "../core" }
winit = "0.30"
pollster = "1"
png = "0.17"
raw-window-handle = "0.6"
rfd = "0.15"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
